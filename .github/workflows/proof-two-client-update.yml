name: Phase C two-client update proof

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Annotated immutable 0.1.0 baseline tag
        required: true
        default: proof/consent-v0.1.0-r3
        type: string
      target_ref:
        description: Immutable 0.1.1 target ref
        required: true
        default: proof/consent-v0.1.1-r3
        type: string
  workflow_call:
    inputs:
      baseline_ref:
        description: Annotated immutable 0.1.0 baseline tag
        required: true
        type: string
      target_ref:
        description: Immutable 0.1.1 target ref
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phase-c-proof-${{ inputs.baseline_ref }}-${{ inputs.target_ref }}
  cancel-in-progress: false

jobs:
  two-client-update:
    name: Alpha/Beta package update and rollback
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install pinned gstack browser driver
        env:
          GSTACK_COMMIT: 94993f74012782fd94416dd44b8314f6363a13a4
          GSTACK_DIR: ${{ runner.temp }}/gstack
        run: |
          git clone https://github.com/garrytan/gstack.git "$GSTACK_DIR"
          git -C "$GSTACK_DIR" checkout --detach "$GSTACK_COMMIT"
          GSTACK_SKIP_FONTS=1 "$GSTACK_DIR/setup" --host codex --quiet --no-team --no-plan-tune-hooks
          test -x "$GSTACK_DIR/browse/dist/browse"

      - name: Install proof harness dependencies
        run: npm ci

      - name: Exercise interruption after target install
        id: interrupted
        env:
          FAIL_AFTER_INSTALL: "1"
          PROOF_BASELINE_REF: ${{ inputs.baseline_ref }}
          PROOF_TARGET_REF: ${{ inputs.target_ref }}
          PROOF_WORK_DIR: /tmp/storm-stack-phase-c-${{ github.run_id }}-${{ github.run_attempt }}/work
          PROOF_OUTPUT_DIR: /tmp/storm-stack-phase-c-${{ github.run_id }}-${{ github.run_attempt }}/output
          PROOF_BROWSE_BIN: ${{ runner.temp }}/gstack/browse/dist/browse
        run: |
          set +e
          npm run proof:two-client-update -- \
            --baseline-ref "$PROOF_BASELINE_REF" \
            --target-ref "$PROOF_TARGET_REF" \
            --work-dir "$PROOF_WORK_DIR" \
            --output "$PROOF_OUTPUT_DIR"
          status=$?
          set -e
          test "$status" -eq 2
          test "$(node -p "require('$PROOF_OUTPUT_DIR/proof-report.json').status")" = "BLOCKED"
          cp "$PROOF_OUTPUT_DIR/proof-report.json" "$PROOF_OUTPUT_DIR/proof-report-interrupted.json"

      - name: Resume and exercise post-migration build recovery
        env:
          FAIL_BUILD_AFTER_MIGRATION: "1"
          PROOF_BASELINE_REF: ${{ inputs.baseline_ref }}
          PROOF_TARGET_REF: ${{ inputs.target_ref }}
          PROOF_WORK_DIR: /tmp/storm-stack-phase-c-${{ github.run_id }}-${{ github.run_attempt }}/work
          PROOF_OUTPUT_DIR: /tmp/storm-stack-phase-c-${{ github.run_id }}-${{ github.run_attempt }}/output
          PROOF_BROWSE_BIN: ${{ runner.temp }}/gstack/browse/dist/browse
        run: |
          npm run proof:two-client-update -- \
            --baseline-ref "$PROOF_BASELINE_REF" \
            --target-ref "$PROOF_TARGET_REF" \
            --work-dir "$PROOF_WORK_DIR" \
            --output "$PROOF_OUTPUT_DIR" \
            --resume
          test "$(node -p "require('$PROOF_OUTPUT_DIR/proof-report.json').status")" = "PASS"
          test "$(node -p "require('$PROOF_OUTPUT_DIR/proof-report.json').pass")" = "true"

      - name: Publish proof summary
        if: always()
        env:
          PROOF_SUMMARY: /tmp/storm-stack-phase-c-${{ github.run_id }}-${{ github.run_attempt }}/output/proof-report.md
        run: |
          if [ -f "$PROOF_SUMMARY" ]; then
            cat "$PROOF_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Phase C proof stopped before producing a Markdown report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Archive proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-c-two-client-update-${{ github.run_id }}
          path: |
            /tmp/storm-stack-phase-c-${{ github.run_id }}-${{ github.run_attempt }}/output
            /tmp/storm-stack-phase-c-${{ github.run_id }}-${{ github.run_attempt }}/work/proof-state.json
            /tmp/storm-stack-phase-c-${{ github.run_id }}-${{ github.run_attempt }}/work/proof-runtime.json
            /tmp/storm-stack-phase-c-${{ github.run_id }}-${{ github.run_attempt }}/work/logs
            /tmp/storm-stack-phase-c-${{ github.run_id }}-${{ github.run_attempt }}/work/artifacts
            /tmp/storm-stack-phase-c-${{ github.run_id }}-${{ github.run_attempt }}/work/artifact-revalidation
            /tmp/storm-stack-phase-c-${{ github.run_id }}-${{ github.run_attempt }}/work/backups
            /tmp/storm-stack-phase-c-${{ github.run_id }}-${{ github.run_attempt }}/work/cleanup.log
          if-no-files-found: warn
          retention-days: 14
