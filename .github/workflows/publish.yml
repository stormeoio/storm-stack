name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0)"
        required: true
        default: "0.1.0"
      dry_run:
        description: "Dry run (no actual publish)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npx turbo build

      - name: Run tests
        run: cd packages/cli && npx vitest run

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PUBLISH_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            PUBLISH_FLAG="--dry-run"
            echo "🔍 DRY RUN — no packages will be published"
          fi

          # Publish order matters — dependencies first
          PACKAGES=(
            "packages/core"
            "packages/react"
            "packages/plugin-auth"
            "packages/plugin-auth-social"
            "packages/plugin-crm"
            "packages/plugin-ticketing"
            "packages/plugin-stripe"
            "packages/cli"
            "packages/create-storm-app"
          )

          for pkg in "${PACKAGES[@]}"; do
            echo ""
            echo "📦 Publishing $pkg..."
            cd "$pkg"
            npm publish --access public $PUBLISH_FLAG || echo "⚠️  $pkg failed or already published"
            cd ../..
          done

          echo ""
          echo "✅ Done!"
