name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0)"
        required: true
        default: "0.1.0"
      dry_run:
        description: "Dry run (no actual publish)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Pre-publish tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Release check
        run: npm run release:check

  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    needs: test
    environment: npm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Build all packages
        run: npx turbo build

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF#refs/tags/v}"
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify package versions
        run: node scripts/check-release-package-versions.mjs "${{ steps.version.outputs.version }}"

      - name: Resolve dry-run flag
        id: flags
        run: |
          DRY_RUN="${{ inputs.dry_run }}"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            DRY_RUN="false"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "args=--dry-run" >> "$GITHUB_OUTPUT"
            echo "label=DRY RUN" >> "$GITHUB_OUTPUT"
          else
            echo "args=--live" >> "$GITHUB_OUTPUT"
            echo "label=LIVE" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (${{ steps.flags.outputs.label }})
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-all.mjs ${{ steps.flags.outputs.args }} --provenance

      - name: Summary
        if: always()
        run: |
          echo "## Publish Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version**: v${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Mode**: ${{ steps.flags.outputs.label }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger**: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
