name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0)"
        required: true
        default: "0.1.0"
      dry_run:
        description: "Dry run (no actual publish)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Pre-publish tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Release check
        run: npm run release:check

  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    needs: test
    environment: npm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Build all packages
        run: npx turbo build

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF#refs/tags/v}"
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify package versions
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PACKAGES=(
            "packages/core"
            "packages/react"
            "packages/testing"
            "packages/plugin-auth"
            "packages/plugin-auth-social"
            "packages/plugin-crm"
            "packages/plugin-ticketing"
            "packages/plugin-stripe"
            "packages/cli"
            "packages/create-storm-app"
          )

          for pkg in "${PACKAGES[@]}"; do
            ACTUAL=$(node -p "require('./$pkg/package.json').version")
            if [ "$ACTUAL" != "$VERSION" ]; then
              echo "::error::$pkg is v$ACTUAL, expected v$VERSION"
              exit 1
            fi
          done

      - name: Resolve dry-run flag
        id: flags
        run: |
          DRY_RUN="${{ inputs.dry_run }}"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            DRY_RUN="false"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "flag=--dry-run" >> "$GITHUB_OUTPUT"
            echo "label=DRY RUN" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "label=LIVE" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (${{ steps.flags.outputs.label }})
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          FLAG="${{ steps.flags.outputs.flag }}"

          echo "Publishing v$VERSION (${{ steps.flags.outputs.label }})"
          echo ""

          # Dependencies first, then dependents
          PACKAGES=(
            "packages/core"
            "packages/react"
            "packages/testing"
            "packages/plugin-auth"
            "packages/plugin-auth-social"
            "packages/plugin-crm"
            "packages/plugin-ticketing"
            "packages/plugin-stripe"
            "packages/cli"
            "packages/create-storm-app"
          )

          FAILED=0
          PUBLISHED=0
          SKIPPED=0
          for pkg in "${PACKAGES[@]}"; do
            PKG_NAME=$(node -p "require('./$pkg/package.json').name")
            echo "--- $PKG_NAME ---"

            if [ -z "$FLAG" ] && npm view "$PKG_NAME@$VERSION" version >/dev/null 2>&1; then
              echo "$PKG_NAME@$VERSION already exists on npm, skipping."
              SKIPPED=$((SKIPPED + 1))
              echo ""
              continue
            fi

            cd "$pkg"
            if npm publish --access public --provenance $FLAG 2>&1; then
              PUBLISHED=$((PUBLISHED + 1))
            else
              echo "::error::$PKG_NAME publish failed"
              FAILED=$((FAILED + 1))
            fi
            cd ../..
            echo ""
          done

          echo "Published $PUBLISHED packages, skipped $SKIPPED already-published packages, failed $FAILED packages"
          if [ "$FAILED" -gt 0 ]; then
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Publish Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version**: v${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Mode**: ${{ steps.flags.outputs.label }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger**: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
