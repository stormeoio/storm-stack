name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (none tags the current version)"
        required: true
        type: choice
        default: none
        options:
          - none
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Resolve version
        id: bump
        run: |
          BUMP="${{ inputs.bump }}"
          if [ "$BUMP" != "none" ]; then
            npm version "$BUMP" --workspaces --no-git-tag-version
            npm version "$BUMP" --no-git-tag-version
            npm run version:sync
          else
            npm run version:check
          fi
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and test release tree
        run: npm run release:check

      - name: Commit and tag
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "No version changes to commit; tagging current HEAD."
          else
            git commit -m "release: v$VERSION"
          fi
          git tag "v$VERSION"
          git push origin HEAD:main --tags

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^v$VERSION$" | head -1)
          CHANGELOG=""
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log "$PREV_TAG..HEAD" --pretty=format:"- %s" --no-merges)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges)
          fi
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes "## Changes

          $CHANGELOG

          ---
          Packages are published automatically via the [Publish workflow](../../actions/workflows/publish.yml)."
