name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (none tags the current version)"
        required: true
        type: choice
        default: none
        options:
          - none
          - patch
          - minor
          - major

permissions: {}

jobs:
  release:
    name: Create release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Authorize release ref
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          if [ "$RELEASE_REF" != "refs/heads/main" ]; then
            printf '::error::Releases are only allowed from refs/heads/main.\n'
            exit 1
          fi

      - run: npm ci

      - name: Resolve version
        id: bump
        env:
          REQUESTED_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          BUMP="$REQUESTED_BUMP"
          if [ "$BUMP" != "none" ]; then
            npm version "$BUMP" --workspaces --no-git-tag-version
            npm version "$BUMP" --no-git-tag-version
            npm run version:sync
          else
            npm run version:check
          fi
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and test release tree
        run: npm run release:check

      - name: Commit and tag
        env:
          RELEASE_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail

          VERSION="$RELEASE_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "No version changes to commit; tagging current HEAD."
          else
            git commit -m "release: v$VERSION"
          fi
          git tag "v$VERSION"
          git push --atomic origin \
            "HEAD:refs/heads/main" \
            "refs/tags/v$VERSION:refs/tags/v$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail

          VERSION="$RELEASE_VERSION"
          PREV_TAG="$(
            git tag --list 'v[0-9]*' --sort=-v:refname \
              | grep -Fvx "v$VERSION" \
              | head -1 \
              || true
          )"
          CHANGELOG=""
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log "$PREV_TAG..HEAD" --pretty=format:"- %s" --no-merges)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges)
          fi
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes "## Changes

          $CHANGELOG

          ---
          Packages are published automatically via the [Publish workflow](../../actions/workflows/publish.yml)."

      - name: Dispatch npm publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail

          VERSION="$RELEASE_VERSION"
          gh workflow run publish.yml \
            --repo "$RELEASE_REPOSITORY" \
            --ref "v$VERSION" \
            --field dry_run=false \
            --field version="$VERSION"
